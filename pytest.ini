[pytest]
# rootdir on sys.path so `import parser.*` and `import ui_helpers` resolve
# without the sys.path juggling the old tests_phase*.py files needed.
pythonpath = .
testpaths = tests
python_files = test_*.py
markers =
    corpus: тести, які будують дорогий канонічний корпус документів
# skip-covered: не печатать сотню строк по модулям со 100 %. Полный отчёт
# попадает в контекст агента на каждом прогоне, и это самый дорогой вывод в
# цикле. Пропущенные строки по модулям ниже 100 % остаются видимыми.
addopts = -q --cov=parser --cov=ui_helpers --cov=compare --cov=search --cov=table_highlighter --cov-report=term-missing:skip-covered --cov-fail-under=90

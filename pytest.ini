[pytest]
# rootdir on sys.path so `import parser.*` and `import ui_helpers` resolve
# without the sys.path juggling the old tests_phase*.py files needed.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --cov=parser --cov=ui_helpers --cov=compare --cov=search --cov-report=term-missing --cov-fail-under=90
